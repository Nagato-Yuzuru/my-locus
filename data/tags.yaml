# Tag registry — SINGLE SOURCE OF TRUTH
# To add a tag: add an entry here, then run `just tags-sync`.
# Naming: id is lowercase, hyphen-separated (e.g. "web-dev").
# Labels: provide at minimum `en` and `zh-cn`.

tags:
