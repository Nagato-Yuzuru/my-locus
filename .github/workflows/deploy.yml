name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # required for .GitInfo and lastmod (enableGitInfo)
          persist-credentials: false

      # Single source of truth for toolchain — reads mise.toml
      - name: Setup toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Cache Hugo resources
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: resources/_gen
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-hugo-resources-

      - name: Validate tags
        run: uv run scripts/validate_tags.py

      - name: Sync tag pages
        run: uv run scripts/sync_tags.py

      - name: Verify "I told you" timestamps
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            uv run scripts/timestamp_take.py verify
          else
            uv run scripts/timestamp_take.py verify --lenient
          fi

      - name: Type-check browser TS
        run: deno check assets/js/*.ts

      - name: Build
        run: hugo --minify
        # baseURL is defined in config/_default/hugo.toml + static/CNAME

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # OIDC deploy; only this job gets write scopes (build runs PR code and third-party actions)
    permissions:
      pages: write
      id-token: write
    # Serialize deployments only, so PR builds can never cancel a queued deploy
    concurrency:
      group: pages
      cancel-in-progress: false
    # Deploy only on push to main (PRs run build as a validation check)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        # OIDC authorization — no API token or secret required
