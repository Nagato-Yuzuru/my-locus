name: autofix.ci  # required: autofix.ci identifies the workflow by this name

on:
  pull_request:

permissions:
  contents: read  # autofix.ci app performs the write-back, not GITHUB_TOKEN

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: jdx/mise-action@v4

      - name: Stamp new takes
        run: uv run scripts/timestamp_take.py stamp

      - uses: autofix-ci/action@v1
