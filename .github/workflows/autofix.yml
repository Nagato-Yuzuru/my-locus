name: autofix.ci  # required: autofix.ci identifies the workflow by this name

on:
  pull_request:

permissions:
  contents: read  # autofix.ci app performs the write-back, not GITHUB_TOKEN

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Stamp new takes
        run: uv run scripts/timestamp_take.py stamp

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
